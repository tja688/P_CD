keywords:
  - id: keyword.enter
    name: 入场
  - id: keyword.adjacent
    name: 相邻
  - id: keyword.pollution
    name: 污染格
  - id: keyword.seal
    name: 封印
  - id: keyword.mirror
    name: 镜像
  - id: keyword.board
    name: 驻场
  - id: keyword.leave
    name: 离场
  - id: keyword.remove
    name: 移除
  - id: keyword.protect
    name: 保护
  - id: keyword.return
    name: 返魂
  - id: keyword.sacrifice
    name: 献祭
  - id: keyword.exhaust
    name: 燃尽
  - id: keyword.activated
    name: 主动触发
  - id: keyword.countdown
    name: 计时
  - id: keyword.swift
    name: 迅捷
  - id: keyword.transform
    name: 转化
  - id: keyword.copy
    name: 复制
statuses:
  - id: status.mark
    name: 解析标记
  - id: status.seal
    name: 封印
    suppresses: true
  - id: status.protect
    name: 保护
  - id: status.return
    name: 返魂
resources:
  - id: resource.faith
    name: 信仰
abilities:
  - id: ability.jam
    trigger: level-start
    actions:
      - kind: pollute
        count: 3
  - id: ability.lock
    trigger: turn-start
    side: monster
    actions:
      - kind: seal-random
        side: opponent
  - id: ability.overload
    trigger: countdown
    countdown: 2
    zone: board
    actions:
      - kind: change-points
        amount: -2
        target: self
cards:
  - id: card.c001
    name: 弱点采样机
    points: 4
    load: 4
    rarity: white
    abilities:
      - target:
          pick: one
          side: opponent
        actions:
          - kind: add-status
            status: status.mark
  - id: card.c002
    name: 巨型机械
    points: 6
    load: 6
    rarity: white
  - id: card.c003
    name: 瞄准打击
    load: 4
    rarity: white
    abilities:
      - target:
          pick: one
          side: opponent
        actions:
          - kind: branch-status
            status: status.mark
            present:
              - kind: clear-status
                status: status.mark
              - kind: change-points
                amount: -5
            absent:
              - kind: change-points
                amount: -3
  - id: card.c004
    name: 引诱机
    points: 5
    load: 4
    rarity: white
    abilities:
      - actions:
          - kind: add-status
            status: status.mark
            target: self
  - id: card.c005
    name: 解析机
    points: 3
    load: 6
    rarity: white
    abilities:
      - trigger: continuous
        zone: board
        actions:
          - kind: continuous-points
            amount: 2
            eachStatus: status.mark
  - id: card.c006
    name: 投影仪
    points: 4
    load: 5
    rarity: white
    abilities:
      - cost:
          sacrifice: 2
        actions:
          - kind: copy
            of: self
            to: mirror
            link: true
  - id: card.c007
    name: 食尸鬼
    points: 2
    load: 5
    rarity: white
    abilities:
      - cost:
          sacrifice: 1
        actions:
          - kind: change-points
            from: discard-count
            target: self
  - id: card.c008
    name: 永生雕像
    points: 3
    load: 5
    rarity: white
    abilities:
      - actions:
          - kind: copy
            of: self
            to: deck
      - trigger: leave
        actions:
          - kind: copy
            of: self
            to: deck
  - id: card.c009
    name: 牺牲图腾
    points: 6
    load: 5
    rarity: white
    abilities:
      - cost:
          sacrifice: 1
  - id: card.c010
    name: 招魂
    load: 4
    rarity: white
    abilities:
      - actions:
          - kind: shuffle-discard
            count: 3
  - id: card.c011
    name: 虔诚信徒
    points: 4
    load: 5
    rarity: white
    abilities:
      - actions:
          - kind: gain-resource
            resource: resource.faith
            amount: 2
  - id: card.c012
    name: 信徒
    points: 3
    load: 4
    rarity: white
    abilities:
      - trigger: turn-end
        zone: board
        actions:
          - kind: gain-resource
            resource: resource.faith
            amount: 1
  - id: card.c013
    name: 牧师
    points: 4
    load: 5
    rarity: white
    abilities:
      - cost:
          resource: resource.faith
          amount: 4
        target:
          pick: one
          side: ally
        actions:
          - kind: add-status
            status: status.return
          - kind: change-points
            amount: 2
  - id: card.c014
    name: 神的雕像
    points: 6
    load: 7
    rarity: white
    abilities:
      - trigger: turn-start
        zone: board
        cost:
          resource: resource.faith
          amount: 1
        actions:
          - kind: change-points
            amount: 1
            target: self
  - id: card.c015
    name: 传教
    load: 9
    rarity: white
    abilities:
      - cost:
          resource: resource.faith
          amount: 4
        target:
          pick: one
          side: opponent
        actions:
          - kind: transform
            card: card.c012
  - id: card.c016
    name: 科学研究器
    points: 4
    load: 5
    rarity: white
    abilities:
      - trigger: turn-end
        zone: board
        target:
          pick: one
          side: opponent
          adjacent: true
        actions:
          - kind: add-status
            status: status.mark
  - id: card.c017
    name: 攻击炮台
    points: 4
    load: 6
    rarity: blue
    abilities:
      - trigger: turn-end
        zone: board
        target:
          pick: one
          side: opponent
          status: status.mark
        actions:
          - kind: change-points
            amount: -2
  - id: card.c018
    name: 蓄能枪台
    points: 5
    load: 5
    rarity: blue
    abilities:
      - trigger: countdown
        countdown: 3
        zone: board
        target:
          pick: random
          side: opponent
        actions:
          - kind: change-points
            amount: -3
          - kind: add-status
            status: status.mark
  - id: card.c019
    name: AI学习机
    points: 5
    load: 6
    rarity: white
    abilities:
      - trigger: countdown
        countdown: 3
        zone: board
        actions:
          - kind: change-points
            amount: 3
            target: self
  - id: card.c020
    name: 数据过量
    load: 4
    rarity: white
    abilities:
      - target:
          pick: one
          side: any
        actions:
          - kind: change-points
            amount: 6
          - kind: grant
            ability: ability.overload
  - id: card.c021
    name: 泰坦级机械
    points: 10
    load: 8
    rarity: blue
  - id: card.c022
    name: 扫描仪
    points: 4
    load: 6
    rarity: white
    abilities:
      - actions:
          - kind: add-status
            status: status.mark
            target: adjacent-opponents
  - id: card.c023
    name: 弱点攻击器
    points: 4
    load: 5
    rarity: white
    abilities:
      - target:
          pick: one
          side: opponent
          status: status.mark
        actions:
          - kind: change-points
            amount: -2
  - id: card.m001
    name: 失控机械
    points: 5
    abilities:
      - trigger: enemy-adjacent-play
        zone: board
        actions:
          - kind: add-status
            status: status.mark
            target: context
  - id: card.m002
    name: 活数据库
    points: 8
    abilities:
      - trigger: enemy-spell
        zone: board
        actions:
          - kind: tick-countdowns
            amount: 1
  - id: card.m003
    name: 废燃泰坦
    points: 10
    abilities:
      - trigger: polluted-play
        zone: board
        actions:
          - kind: change-points
            amount: 2
            target: self
